<!doctype html><html lang="ru"><meta charset="utf-8"><title>Misdeal — native before / after</title><style>body{background:#171411;color:#ecd8b5;font:18px system-ui;margin:24px}select{font:inherit;margin:12px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}img{width:100%;height:auto}p{max-width:1100px}</style><h1>Misdeal: реальные кадры Godot 1280×720</h1><p>До: main d9613298. После: код 1edd3cf7. Для кнопки победы кадр «до» снят на 2dca35fc перед исправлением слоя. Движущиеся фигурки могут отличаться по фазе; это не замена артов.</p><label>Экран <select id="pick"></select></label><main><section><h2>До</h2><img id="before"></section><section><h2>После</h2><img id="after"></section></main><script>const names=["upgrade_knight", "reward_normal_loot", "shop_rich", "shop_bought", "event_blood_ledger", "end_full", "battle_result"];const pick=document.getElementById('pick');for(const n of names){const o=document.createElement('option');o.textContent=n;o.value=n;pick.append(o)}function show(){for(const side of ['before','after'])document.getElementById(side).src=side+'/'+pick.value+'.png'}pick.onchange=show;show();</script></html>
