name: D259 Stage three Black Lantern game atlases

on:
  push:
    branches: [main]
    paths:
      - 'tools/art/stage_black_lantern_d259.py'
      - '.github/workflows/d259-black-lantern-game-atlases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lossless pixel atlas encoder
        run: python -m pip install 'Pillow>=10,<12'
      - name: Stage source-equivalent canonical animations and verify every frame
        run: python tools/art/stage_black_lantern_d259.py
      - name: Commit three canonical assets and static QC report
        shell: bash
        run: |
          git add \
            assets/pixel/units/deck_expansion_v1/extinguished_guide_frames.webp.b64 \
            assets/pixel/units/deck_expansion_v1/oil_acolyte_frames.webp.b64 \
            assets/pixel/units/deck_expansion_v1/lantern_archer_frames.webp.b64 \
            docs/qa/D259_BLACK_LANTERN_CANONICAL_ATLASES_QC.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'art(d259): stage three full original Black Lantern runtime atlases (QA only)'
            git push origin HEAD:main
          fi
