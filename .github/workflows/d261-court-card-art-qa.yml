name: D261 Selected Court Card Art QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d261-court-card-art-qa.yml'
      - 'assets/pixel/card_unification_v1/run/court_of_the_mute_selected_v1.webp.b64'
      - 'scripts/ui/card_unification_v1.gd'
      - 'scripts/dev/court_of_the_mute_d261_card_preview.gd'
      - 'scenes/dev/court_of_the_mute_d261_card_preview.tscn'
      - 'resources/cards/court_of_the_mute.tres'
      - 'scripts/core/run_state.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-selected-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact transferred WebP card export
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path
          import struct
          path = Path('assets/pixel/card_unification_v1/run/court_of_the_mute_selected_v1.webp.b64')
          original = base64.b64decode(path.read_text().strip(), validate=True)
          expected = '704eef553a1ef528d2793b692462315048b06cf23ddaf17dff0c1fba0ed69d5c'
          assert hashlib.sha256(original).hexdigest() == expected, 'D261: approved option 2 transfer corrupted'
          assert original[:4] == b'RIFF' and original[8:12] == b'WEBP', 'D261: not WebP'
          print('D261_CARD_SOURCE_HASH_PASS',len(original),expected)
          PY
      - name: Install official Godot 4.7.2 (GDScript)
        shell: bash
        run: |
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Native Godot import and script parse
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d261-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d261-import.log; then exit 1; fi
      - name: Native card resource and exact-art preview
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --quit-after 60 --scene res://scenes/dev/court_of_the_mute_d261_card_preview.tscn 2>&1 | tee /tmp/d261-preview.log
          grep -q 'D261_SELECTED_ART_PASS:' /tmp/d261-preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D261: ' /tmp/d261-preview.log; then exit 1; fi
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d261-approved-second-card-art-qa
          path: /tmp/d261-*.log
          retention-days: 14
