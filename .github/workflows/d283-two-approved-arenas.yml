name: D283 approved arena native smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d283-two-approved-arenas.yml'
      - 'assets/pixel/battle/arenas/approved_d283/*.webp'
      - 'scripts/battle/authored_backdrop.gd'
      - 'scripts/dev/d283_approved_arenas_native_smoke.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-arenas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d283-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d283-import.log; then exit 1; fi
      - name: Verify exact selected images through the native runtime loader
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d283_approved_arenas_native_smoke.gd 2>&1 | tee /tmp/d283-native.log
          grep -q 'D283_APPROVED_ARENAS_NATIVE_PASS' /tmp/d283-native.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D283_APPROVED_ARENAS_FAIL' /tmp/d283-native.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d283-arenas-native-qa
          path: /tmp/d283-*.log
          retention-days: 14
