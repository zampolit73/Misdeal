name: One-time vendor of GUT 9.7.1 (pilot branch only)

on:
  push:
    branches:
      - test/gut-971-pilot-20261023
    paths:
      - .github/workflows/gut-vendor-once.yml

permissions:
  contents: write

jobs:
  vendor-pinned-addon:
    if: github.repository == 'zampolit73/Misdeal'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned MIT-licensed GUT plugin without modifying game code
        shell: bash
        run: |
          set -euo pipefail
          test ! -e addons/gut/plugin.cfg
          git clone --quiet --depth 1 --branch v9.7.1 --filter=blob:none \
            https://github.com/bitwes/Gut.git /tmp/gut-971-source
          actual="$(git -C /tmp/gut-971-source rev-parse HEAD)"
          expected="aeb5d4f3f7f0a6c9b5e178876d6c99b791fda605"
          test "$actual" = "$expected"
          test -f /tmp/gut-971-source/addons/gut/LICENSE.md
          test -f /tmp/gut-971-source/addons/gut/plugin.cfg
          mkdir -p addons
          cp -a /tmp/gut-971-source/addons/gut addons/
          git add -- addons/gut
          git -c user.name='Misdeal QA Bot' -c user.email='actions@users.noreply.github.com' \
            commit -m "vendor(test): pin original GUT 9.7.1 addon for Godot 4.7.x"
          git push origin "HEAD:refs/heads/test/gut-971-pilot-20261023"
          echo "Pinned GUT 9.7.1 source: $expected" >> "$GITHUB_STEP_SUMMARY"
