name: D279 Fate choice on cursed tabletop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d279-class-select.yml'
      - 'scenes/class_select/class_select.tscn'
      - 'scripts/class_select/class_select.gd'
      - 'scripts/class_select/class_select_card_skin.gd'
      - 'scripts/class_select/class_select_clean_backdrop.gd'
      - 'assets/pixel/class_select/d280_clean_table_*.webp.b64'
      - 'scripts/dev/d279_class_select_smoke.gd'
      - 'scripts/table/table_offer_frame_asset.gd'
      - 'shaders/table_offer_parchment.gdshader'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-class-select:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Verify D280 clean tabletop bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,io
          parts=[Path(f"assets/pixel/class_select/d280_clean_table_{i:02d}.webp.b64") for i in range(1,4)]
          raw=base64.b64decode("".join(p.read_text().strip() for p in parts),validate=True)
          assert len(raw)==11320 and raw[:4]==b"RIFF" and raw[8:12]==b"WEBP"
          assert hashlib.sha256(raw).hexdigest()=="8005eca284768611b923cdf8b87f9a8f4db0554dd4a7e4d6277925c27a6d93fe"
          print("D280_CLEAN_ART_PASS: separate WebP clean tableau, 640x360, 11320 bytes")
          PY
      - name: Import and parse all Godot scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d279-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d279-import.log; then exit 1; fi
      - name: Real ClassSelect interaction smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 65s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d279_class_select_smoke.gd 2>&1 | tee /tmp/d279-test.log
          grep -q 'D280_CLASS_SELECT_PASS' /tmp/d279-test.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D279_CLASS_SELECT_FAIL' /tmp/d279-test.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d279-fate-class-select-qa
          path: /tmp/d279-*.log
          retention-days: 14
