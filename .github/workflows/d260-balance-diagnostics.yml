name: D260 Black Lantern balance diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d260-balance-diagnostics.yml'
      - 'scripts/dev/black_lantern_d260_balance_diagnostics.gd'
      - 'scripts/dev/black_lantern_road_battle_matrix.gd'
      - 'scenes/dev/black_lantern_d260_balance_diagnostics.tscn'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance-54:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Get Godot 4.7.2
        run: |
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Run full real BattleUnit diagnostics
        shell: bash
        run: |
          set -o pipefail
          timeout 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://scenes/dev/black_lantern_d260_balance_diagnostics.tscn 2>&1 | tee /tmp/balance.log
          grep -q 'D260_BALANCE_DIAGNOSTICS ' /tmp/balance.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D207:|D208:' /tmp/balance.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d260-balance-logs
          path: /tmp/balance.log
          retention-days: 14
