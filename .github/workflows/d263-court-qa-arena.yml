name: D263 Court empty architectural arena source

on:
  push:
    branches: [main]
    paths:
      - 'tools/art/author_court_d263_arena.py'
      - '.github/workflows/d263-court-qa-arena.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author-empty-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lossless pixel compositor
        run: python -m pip install 'Pillow>=10,<12'
      - name: Generate original character-free Court QA backdrop
        run: python tools/art/author_court_d263_arena.py
      - name: Commit auditable QA arena and metrics
        shell: bash
        run: |
          git add assets/pixel/battle/arenas/court_of_the_mute_d263_qa.webp.b64 docs/qa/D263_COURT_ARENA_QC.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'art(d263): stage empty original Court tribunal architecture QA candidate'
            git push origin HEAD:main
          fi
