name: D258 Black Lantern Godot 4.7 native smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d258-black-lantern-native-smoke.yml'
      - 'scripts/dev/black_lantern_d258_*.gd'
      - 'scenes/dev/black_lantern_d258_*.tscn'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 (GDScript / non-.NET)
        shell: bash
        run: |
          curl --retry 3 --retry-delay 2 --fail --location \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot-4.7.2.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot-4.7.2.zip" | sha256sum -c -
          unzip -q /tmp/godot-4.7.2.zip -d /tmp/godot-bin
          mv /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot-bin/godot
          chmod +x /tmp/godot-bin/godot
          /tmp/godot-bin/godot --version
      - name: Import Godot project and parse GDScript
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/d258-import.log
          if grep -E -i "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script" /tmp/d258-import.log; then
            exit 1
          fi
      - name: Smoke isolated five-enemy real-AI scene
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/godot --headless --path . --quit-after 800 \
            --scene res://scenes/dev/black_lantern_d258_five_enemy_combat_qa.tscn 2>&1 | tee /tmp/d258-3v5.log
          if grep -E -i "SCRIPT ERROR|Parse Error|Parser Error|D258 / QA FAIL|D258: .*failed|D258: .*missing|D258: unknown" /tmp/d258-3v5.log; then
            exit 1
          fi
          grep -q "D258: all five distinct original rich-visual skeletons" /tmp/d258-3v5.log
      - name: Smoke genuine Battle route launcher scene
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/godot --headless --path . --quit-after 24 \
            --scene res://scenes/dev/black_lantern_d258_real_battle_route_qa.tscn 2>&1 | tee /tmp/d258-route.log
          if grep -E -i "SCRIPT ERROR|Parse Error|Parser Error|D258: .*failed|D258: .*missing" /tmp/d258-route.log; then
            exit 1
          fi
      - name: Run real Godot 54-case encounter balance matrix
        shell: bash
        run: |
          set -o pipefail
          timeout 180s /tmp/godot-bin/godot --headless --path . \
            --scene res://scenes/dev/black_lantern_d258_native_balance_matrix.tscn \
            2>&1 | tee /tmp/d258-matrix.log
          grep -q 'D258_MATRIX_RESULT ' /tmp/d258-matrix.log
          if grep -E -i "SCRIPT ERROR|Parse Error|Parser Error|D207: .*fail" /tmp/d258-matrix.log; then
            exit 1
          fi
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d258-godot-native-headless-logs
          path: /tmp/d258-*.log
          if-no-files-found: ignore
          retention-days: 14
