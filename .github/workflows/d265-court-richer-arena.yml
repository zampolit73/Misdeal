name: D265 Court rich empty arena candidate

on:
  push:
    branches: [main]
    paths:
      - 'tools/art/author_court_d265_rich_arena.py'
      - '.github/workflows/d265-court-richer-arena.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-richer-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image pipeline
        run: python -m pip install 'Pillow>=10,<12'
      - name: Author improved actor-free stone tribunal and strict decode QC
        run: python tools/art/author_court_d265_rich_arena.py
      - name: Commit QA-only arena bitmap and source report
        shell: bash
        run: |
          git add assets/pixel/battle/arenas/court_of_the_mute_d265_rich_qa.webp.b64 docs/qa/D265_COURT_RICH_EMPTY_ARENA_QC.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'art(d265): stage richer original actor-free Court backdrop for F6 QA'
            git push origin HEAD:main
          fi
