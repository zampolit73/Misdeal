name: D271 one-time binary artwork intake
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d271-painted-asset-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-exact-painted-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download original 1280x720 painted bitmap via verified media source
        shell: bash
        env:
          D271_CDN_1: ""
          D271_CDN_2: ""
          D271_CDN_THUMB: ""
        run: |
          set -euo pipefail
          python -m pip -q install pillow
          python - <<'PY'
          import os,base64,urllib.request,io,hashlib
          from PIL import Image
          for i,k in enumerate(('D271_CDN_1','D271_CDN_2','D271_CDN_THUMB'),1):
              url=base64.b64decode(os.environ[k]).decode()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; Misdeal-Art-Import/1.0)'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      b=r.read()
                  im=Image.open(io.BytesIO(b)).convert('RGB')
                  print('D271_CDN_PROBE',i,'status=200','dimensions=',im.size,'source_bytes=',len(b))
                  if im.size!=(1280,720):
                      continue
                  pixels=hashlib.sha256(im.tobytes()).hexdigest()
                  print('D271_SOURCE_PIXEL_SHA256',pixels)
                  if pixels!='d75a1fda34582e47557beae4a00da08e0af92c7cae35f19e8cf6632931c145f9':
                      print('SOURCE_IMAGE_NOT_IDENTICAL; refusing to install')
                      continue
                  buf=io.BytesIO()
                  im.save(buf,format='WEBP',quality=88,method=6)
                  image=buf.getvalue()
                  src='assets/pixel/battle/arenas/court_of_the_mute_d271_painted_qa.webp.b64'
                  os.makedirs(os.path.dirname(src),exist_ok=True)
                  with open(src,'w') as out:out.write(base64.b64encode(image).decode()+'\n')
                  with open('/tmp/d271-import-ok','w') as f:f.write(hashlib.sha256(image).hexdigest())
                  print('D271_PAINTED_BINARY_PREPARED',len(image),'sha256',hashlib.sha256(image).hexdigest())
                  break
              except Exception as e:
                  print('D271_CDN_PROBE',i,'failed:',str(e)[:130])
          assert os.path.isfile('/tmp/d271-import-ok'), 'Full-resolution exact source unavailable; do not import scaled thumbnail'
          PY
      - name: Commit actual raster file, not SVG placeholder
        shell: bash
        run: |
          git config user.name "Misdeal Art Intake Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel/battle/arenas/court_of_the_mute_d271_painted_qa.webp.b64
          git diff --cached --quiet && exit 1 || true
          git commit -m "art(d271): install authentic painted Court 1280x720 QA backdrop"
          git push origin HEAD:main
