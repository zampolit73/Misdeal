name: D271 one-time binary artwork intake
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d271-painted-asset-intake.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-exact-painted-art:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact painted PNG through temporary authenticated upload bridge
        shell: bash
        env:
          D271_SOURCE: 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-0b8c-81f5-96eb-39612c49822b/raw?se=2026-10-19T13%3A30%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=d7b204e4-61fb-4284-ab71-dd37713be4a0&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-18T14%3A33%3A49Z&ske=2026-10-19T14%3A33%3A49Z&sks=b&skv=2026-02-06&sig=6psgy%2B/r%2BqV9vEy4cRMCg8wpbVTD4AixZjKMPuZmxWg%3D'
          D271_FALLBACK: 'https://docs.google.com/slides-images-rt/AE1YXSbd8zqv-zEoluK92zJv8npP7R6LhO2IAb4LxPXdHf_jDLHI-jMk0LnqECCbs-0W3LFd5PXhHqxhCnp2dDCbGJEWZdii8-kJPp6CkQk6-Fl1_gcyKsMB7aTvqS5QOdIu-GdAbEzKdAX0_7FubbWq0AgbZc_PcDFRJNIWM8UhgRnaom17UKk=s2048?key=v1EBVr8_4kSbqmEMo-VUuw'
        run: |
          set -euo pipefail
          python -m pip -q install pillow
          python - <<'PY'
          import os,urllib.request,io,hashlib,base64
          from PIL import Image
          want = 'd75a1fda34582e47557beae4a00da08e0af92c7cae35f19e8cf6632931c145f9'
          for name in ('D271_SOURCE','D271_FALLBACK'):
              try:
                  req=urllib.request.Request(os.environ[name],headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      data=response.read()
                  im=Image.open(io.BytesIO(data)).convert('RGB')
                  got=hashlib.sha256(im.tobytes()).hexdigest()
                  print('D271_TRANSFER_IMAGE',name,'dims=',im.size,'pixel_sha=',got,'source_bytes=',len(data))
                  if im.size!=(1280,720) or got!=want:continue
                  file='assets/pixel/battle/arenas/court_of_the_mute_d271_painted_qa.webp.b64'
                  buf=io.BytesIO();im.save(buf,format='WEBP',quality=88,method=6)
                  raw=buf.getvalue()
                  os.makedirs(os.path.dirname(file),exist_ok=True)
                  with open(file,'w') as dst:dst.write(base64.b64encode(raw).decode()+'\n')
                  print('D271_PAINTED_SOURCE_IMPORTED',hashlib.sha256(raw).hexdigest(),len(raw),'1280x720')
                  break
              except Exception as e: print('D271_DOWNLOAD_FAILED',name,str(e)[:140])
          assert os.path.isfile('assets/pixel/battle/arenas/court_of_the_mute_d271_painted_qa.webp.b64'), 'Source image not identical (or failed to download), no asset committed'
          PY
      - name: Commit the real painted arena bytes directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Misdeal Art Intake Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel/battle/arenas/court_of_the_mute_d271_painted_qa.webp.b64
          if git diff --cached --quiet; then echo 'No image change'; exit 1; fi
          git commit -m "art(d271): import 1280x720 genuine painted Court arena"
          git push origin HEAD:main
