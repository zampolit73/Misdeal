name: CI3 real Godot scene screenshots

on:
  pull_request:
    paths:
      - '.github/workflows/godot-render-previews.yml'
      - 'scripts/dev/ci3_capture_rendered_scene.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Prepare software-rendered display
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          mkdir -p "$RUNNER_TEMP/misdeal-ci3"
          printf '## Actual 1280×720 Godot renderer captures\n\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Import game assets in the official editor
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          timeout 300s "$godot" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/misdeal-ci3/import.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' "$RUNNER_TEMP/misdeal-ci3/import.log"; then
            exit 1
          fi

      - name: Render four real gameplay and QA scenes
        shell: bash
        run: |
          set -uo pipefail
          godot=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          out="$RUNNER_TEMP/misdeal-ci3"
          failures=0
          scenes=(class-select table wizard-prep card-gallery)
          n=0
          for key in "${scenes[@]}"; do
            n=$((n + 1))
            png="$out/0$n-$key.png"
            log="$out/$key.log"
            echo "::group::Real Godot capture: $key"
            if timeout 110s xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
                env LIBGL_ALWAYS_SOFTWARE=1 \
                "$godot" --path . --windowed --resolution 1280x720 \
                --rendering-method gl_compatibility \
                --script res://scripts/dev/ci3_capture_rendered_scene.gd \
                -- "$key" "$png" 2>&1 | tee "$log"; then
              status=0
            else
              status=$?
            fi
            if [ "$status" -eq 0 ] && grep -Fq "CI3_CAPTURE_PASS: $key" "$log" && [ -s "$png" ]; then
              echo "- ✅ $key — Godot framebuffer PNG created" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $key — capture error (exit $status; see $key.log)" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "$failures rendered scene capture(s) failed" >&2
            exit 1
          fi

      - name: Validate real PNG dimensions and size
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import struct
          import os

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "misdeal-ci3"
          scenes = ["class-select", "table", "wizard-prep", "card-gallery"]
          hashes = set()
          for index, name in enumerate(scenes, 1):
              path = root / f"0{index}-{name}.png"
              content = path.read_bytes()
              assert content[:8] == b"\x89PNG\r\n\x1a\n", f"{name}: not PNG"
              assert content[12:16] == b"IHDR", f"{name}: no IHDR"
              width, height = struct.unpack(">II", content[16:24])
              assert (width, height) == (1280, 720), f"{name}: {(width, height)}"
              assert len(content) > 10000, f"{name}: suspiciously tiny framebuffer"
              digest = hashlib.sha256(content).hexdigest()
              assert digest not in hashes, f"{name}: duplicate screenshot"
              hashes.add(digest)
              print(f"CI3_PNG_PASS: {name} 1280x720 {len(content)} bytes sha256={digest}")
          PY
          echo '✅ All four original Godot views produced distinct, nonempty 1280×720 PNGs.' >> "$GITHUB_STEP_SUMMARY"

      - name: Save screenshots and diagnostic logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: misdeal-ci3-real-rendered-scenes
          path: |
            ${{ runner.temp }}/misdeal-ci3/*.png
            ${{ runner.temp }}/misdeal-ci3/*.log
          if-no-files-found: warn
          retention-days: 14
