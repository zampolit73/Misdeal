name: D241 Sentinel Wholebody QA Build

on:
  push:
    branches: [main]
    paths:
      - 'tools/art/author_road_sentinel_d241_wholebody25.py'
      - '.github/workflows/d241-wholebody-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Validate coherent 25-frame painted full-body pack
        shell: bash
        run: |
          mkdir -p docs/qa
          if python tools/art/author_road_sentinel_d241_wholebody25.py > docs/qa/D241_BUILD_STATUS.txt 2>&1; then
            echo 'STATUS=PASS' >> docs/qa/D241_BUILD_STATUS.txt
          else
            echo 'STATUS=FAIL; NO READY GAME ART PUBLISHED' >> docs/qa/D241_BUILD_STATUS.txt
          fi
      - name: Commit internal full 25 QA candidate
        run: |
          git add docs/qa/D241_BUILD_STATUS.txt
          if [ -f assets/pixel/units/black_lantern_road_qa/road_sentinel_d241_wholebody25_qa.webp.b64 ]; then
            git add assets/pixel/units/black_lantern_road_qa/road_sentinel_d241_wholebody25_qa.webp.b64 docs/qa/D241_SENTINEL_WHOLEBODY_QC.json
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'qa(d241): stage painted wholebody 25-frame Sentinel candidate'
            git push origin HEAD:main
          fi
