name: D262 Court Verdict Native Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d262-court-verdict-contract.yml'
      - 'scripts/battle/court_verdict.gd'
      - 'scripts/battle/battle.gd'
      - 'scripts/dev/court_of_the_mute_d262_verdict_contract.gd'
      - 'scenes/dev/court_of_the_mute_d262_verdict_contract.tscn'
      - 'resources/encounters/court_of_the_mute.tres'
      - 'resources/units/mute_magistrate.tres'
      - 'resources/units/ash_scrivener.tres'
      - 'resources/units/bone_bailiff.tres'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 GDScript
        shell: bash
        run: |
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-dir
          chmod +x /tmp/godot-dir/Godot_v4.7.2-stable_linux.x86_64
      - name: Project import and GDScript parse
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-dir/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d262-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d262-import.log; then exit 1; fi
      - name: Real BattleUnit marked-target contract, two Court formations
        shell: bash
        run: |
          set -o pipefail
          timeout 65s /tmp/godot-dir/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://scenes/dev/court_of_the_mute_d262_verdict_contract.tscn 2>&1 | tee /tmp/d262-court-contract.log
          grep -q 'D262_COURT_VERDICT_PASS' /tmp/d262-court-contract.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D262_COURT_VERDICT_FAIL' /tmp/d262-court-contract.log; then exit 1; fi
      - name: Preserve source and contract logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d262-court-native-logs
          path: /tmp/d262-*.log
          retention-days: 14
