name: D260 Black Lantern released deal and Battle route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d260-black-lantern-release.yml'
      - 'scripts/core/run_state.gd'
      - 'scripts/dev/black_lantern_d260_release_*.gd'
      - 'scenes/dev/black_lantern_d260_release_*.tscn'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-card-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and check GDScript parser
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d260-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d260-import.log; then exit 1; fi
      - name: Load native F6 released-card preview without scripting errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 18 \
            --scene res://scenes/dev/black_lantern_d260_released_battle_preview.tscn 2>&1 | tee /tmp/d260-preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D260:.*failed' /tmp/d260-preview.log; then exit 1; fi
      - name: Released Tier 1 normal deal and real Battle Reward Table smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 150s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path .             --scene res://scenes/dev/black_lantern_d260_release_route_runner.tscn 2>&1 | tee /tmp/d260-released-route.log
          grep -q 'D260_REAL_DEAL_PASS:' /tmp/d260-released-route.log
          grep -q 'D260_RELEASE_ROUTE_PASS:' /tmp/d260-released-route.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D260_RELEASE_ROUTE_FAIL:' /tmp/d260-released-route.log; then exit 1; fi
      - name: Preserve native QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d260-released-card-native-smoke
          path: /tmp/d260-*.log
          retention-days: 14
