name: D267 Court approved rich art native integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d267-court-rich-art-ci.yml'
      - 'tools/art/author_court_d267_rich_atlases.py'
      - 'assets/pixel/units/court_of_the_mute_qa/*_d267_rich_qa.webp.b64'
      - 'assets/pixel/units/court_of_the_mute_qa/source_d267/*.b64'
      - 'scripts/battle/unit_animation_library.gd'
      - 'scripts/dev/court_of_the_mute_d267_rich_animation_preview.gd'
      - 'scenes/dev/court_of_the_mute_d267_rich_animation_preview.tscn'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-godot-art-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source art seam recovery dependencies
        run: python -m pip install 'Pillow>=10,<12' 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5'
      - name: Recreate all 75 art frames from user-approved lossless original sheets
        shell: bash
        run: |
          set -euo pipefail
          python tools/art/author_court_d267_rich_atlases.py
          python - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          qc=json.loads(Path('docs/qa/D267_RICH_COURT_ART_RECOVERY_QC.json').read_text())
          assert qc['accepted_structurally']==75, qc
          assert qc['source_warnings_total']==27, qc
          expected={
            'mute_magistrate':'bcd51d98ceb255da89cc0e1385b998e3fef1bd51c754831200652d1ae9610dd8',
            'ash_scrivener':'2f56d0f76c80640982b1738234b48da0f4ddc8e71a959e38aaff4a74ab7d8f1d',
            'bone_bailiff':'c42fc265000e4f742771a7e18d104c995820514763b13ec7ab189ff5f3229fb8'
          }
          for role,sha in expected.items():
            raw=base64.b64decode(Path(f'assets/pixel/units/court_of_the_mute_qa/{role}_d267_rich_qa.webp.b64').read_text().strip())
            assert hashlib.sha256(raw).hexdigest()==sha,role
          print('D267_75_APPROVED_SPRITE_SOURCE_REPRO_PASS: all original role assets decode; 27 raw source seam warnings remain flagged')
          PY
          git diff --exit-code -- assets/pixel/units/court_of_the_mute_qa/*_d267_rich_qa.webp.b64
      - name: Fetch Godot 4.7.2
        shell: bash
        run: |
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse current native scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d267-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d267-import.log; then exit 1; fi
      - name: Play all three original rich SpriteFrames in single x1/x2 F6 scene
        shell: bash
        run: |
          set -o pipefail
          timeout 75s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --quit-after 36 --scene res://scenes/dev/court_of_the_mute_d267_rich_animation_preview.tscn 2>&1 | tee /tmp/d267-art-preview.log
          grep -q 'D267_THREE_RICH_COURT_F6_PASS' /tmp/d267-art-preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D267.*FAIL' /tmp/d267-art-preview.log; then exit 1; fi
      - name: Court timed verdict and original strict sprite contract
        shell: bash
        run: |
          set -o pipefail
          timeout 75s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --scene res://scenes/dev/court_of_the_mute_d262_verdict_contract.tscn 2>&1 | tee /tmp/d267-verdict.log
          grep -q 'D262_COURT_VERDICT_PASS' /tmp/d267-verdict.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D262_COURT_VERDICT_FAIL' /tmp/d267-verdict.log; then exit 1; fi
      - name: Real Battle Court four enemies and all six hero/formation setups
        shell: bash
        run: |
          set -o pipefail
          timeout 100s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --scene res://scenes/dev/court_of_the_mute_d262_real_battle_boot.tscn 2>&1 | tee /tmp/d267-real-battle.log
          grep -q 'D262_COURT_REAL_BATTLE_PASS' /tmp/d267-real-battle.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D262_COURT_REAL_BATTLE_FAIL' /tmp/d267-real-battle.log; then exit 1; fi
      - name: Released card 38 regression - 54 battle cases unaffected
        shell: bash
        run: |
          set -o pipefail
          timeout 140s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --scene res://scenes/dev/black_lantern_d260_balance_diagnostics.tscn 2>&1 | tee /tmp/d267-regression.log
          grep -q 'D260_BALANCE_DIAGNOSTICS ' /tmp/d267-regression.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D260: выпущенная' /tmp/d267-regression.log; then exit 1; fi
      - name: Preserve art and native Battle QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d267-court-approved-rich-original-art-ci
          path: /tmp/d267-*.log
          retention-days: 14
