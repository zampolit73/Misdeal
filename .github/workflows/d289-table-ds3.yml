name: D289 DS3 Table visual-only native smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d289-table-ds3.yml'
      - 'scenes/table/table.tscn'
      - 'scripts/table/table.gd'
      - 'scripts/table/table_ds3_pass.gd'
      - 'scripts/table/table_offer_skin.gd'
      - 'scripts/ui/misdeal_ds3.gd'
      - 'scripts/dev/d289_table_ds3_smoke.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-table-ds3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Godot import and parse
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d289-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d289-import.log; then exit 1; fi
      - name: Validate actual two-card Table with DS3 chrome
        shell: bash
        run: |
          set -o pipefail
          timeout 70s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d289_table_ds3_smoke.gd 2>&1 | tee /tmp/d289-table.log
          grep -q 'D289_DS3_TABLE_NATIVE_PASS' /tmp/d289-table.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D289_DS3_TABLE_FAIL' /tmp/d289-table.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d289-ds3-table-native
          path: /tmp/d289-*.log
          retention-days: 14
