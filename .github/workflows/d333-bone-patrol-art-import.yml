name: D333 Approved Bone Patrol Art Import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d333-bone-patrol-art-import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Build art from user-approved uploaded reference
        env:
          APPROVED_PREVIEW: "https://media.canva.com/v2/image-resize/format:PNG/height:122/quality:100/uri:ifs%3A%2F%2FM%2F7fa3670a-7313-43f5-b38c-5cef02cc8fe3/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAASDZO8xv1jNZlIKTbXGoYmUoSGsnQdvWnI7MzkGXg8T&exp=1792628004&osig=AAAAAAAAAAAAAAAAAAAAAEPIHoLzVjTA23fT2PZX1Sp5-A2M76KQMjtivt8iIhRy&signer=media-rpc&token=AAIAAU0AJDdmYTM2NzBhLTczMTMtNDNmNS1iMzhjLTVjZWYwMmNjOGZlMwAAAAABoWD0lKC8unhM_bMQCANl_jqABIjIciazQkdFPzq5yJoiVJJ8lw&x-canva-quality=thumbnail"
        run: python tools/art/d333_import_bone_patrol.py
      - name: Publish card art and bind original card ID
        run: |
          git add assets/pixel/card_unification_v1/run/bone_patrol_d333_approved_tower.webp scripts/ui/card_unification_v1.gd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && exit 1
          git commit -m "D333: Ship approved bone_patrol watchtower artwork"
          git push origin HEAD:main
