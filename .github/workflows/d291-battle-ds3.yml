name: D291 DS3 Battle native UI smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d291-battle-ds3.yml'
      - 'scripts/battle/battle_ds3_pass.gd'
      - 'scripts/ui/battle_approved_modules.gd'
      - 'scripts/ui/battle_engraved_frame.gd'
      - 'assets/pixel/ui/battle_ds3_d303/**'
      - 'assets/pixel/ui/battle_ds3_d307/**'
      - 'tools/install_d303_battle_art.ps1'
      - 'scripts/battle/battle.gd'
      - 'scripts/ui/misdeal_ds3.gd'
      - 'scenes/battle/battle.tscn'
      - 'scripts/dev/d291_battle_ds3_smoke.gd'
      - 'scripts/dev/d306_wizard_objective_smoke.gd'
      - 'scripts/dev/d308_wizard_panel_preview.gd'
      - 'scripts/dev/d308_wizard_preview_smoke.gd'
      - 'scenes/dev/d308_wizard_panel_preview.tscn'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-battle-ds3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Native Godot editor import and parse
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d291-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d291-import.log; then exit 1; fi
      - name: Boot real Battle and verify DS3 tactical UI states
        shell: bash
        run: |
          set -o pipefail
          timeout 75s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d291_battle_ds3_smoke.gd 2>&1 | tee /tmp/d291-battle.log
          grep -q 'D291_BATTLE_DS3_NATIVE_PASS' /tmp/d291-battle.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D291_BATTLE_DS3_FAIL' /tmp/d291-battle.log; then exit 1; fi
      - name: Verify real Grave Bell side objective in preparation and combat
        shell: bash
        run: |
          set -o pipefail
          timeout 75s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d306_wizard_objective_smoke.gd 2>&1 | tee /tmp/d306-wizard-objective.log
          grep -q 'D306_WIZARD_OBJECTIVE_NATIVE_PASS' /tmp/d306-wizard-objective.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D306_WIZARD_OBJECTIVE_FAIL' /tmp/d306-wizard-objective.log; then exit 1; fi
      - name: Verify D308 F6 art preview scene and condition controls
        shell: bash
        run: |
          set -o pipefail
          timeout 75s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d308_wizard_preview_smoke.gd 2>&1 | tee /tmp/d308-wizard-preview.log
          grep -q 'D308_WIZARD_PREVIEW_NATIVE_PASS' /tmp/d308-wizard-preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D308_WIZARD_PREVIEW_FAIL' /tmp/d308-wizard-preview.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d291-battle-ds3-native
          path: |
            /tmp/d291-*.log
            /tmp/d306-*.log
            /tmp/d308-*.log
          retention-days: 14
