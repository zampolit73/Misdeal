name: D259 Canonical five-role Godot 4.7 QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d259-black-lantern-native-qa.yml'
      - 'scripts/battle/unit_animation_library.gd'
      - 'scripts/dev/black_lantern_d259_*.gd'
      - 'scenes/dev/black_lantern_d259_*.tscn'
      - 'assets/pixel/units/deck_expansion_v1/extinguished_guide_frames.webp.b64'
      - 'assets/pixel/units/deck_expansion_v1/oil_acolyte_frames.webp.b64'
      - 'assets/pixel/units/deck_expansion_v1/lantern_archer_frames.webp.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 (GDScript / non-.NET)
        shell: bash
        run: |
          curl --retry 3 --retry-delay 2 --fail --location \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot-4.7.2.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot-4.7.2.zip" | sha256sum -c -
          unzip -q /tmp/godot-4.7.2.zip -d /tmp/godot-bin
          mv /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot-bin/godot
          chmod +x /tmp/godot-bin/godot
          /tmp/godot-bin/godot --version
      - name: Import Godot project and parse GDScript
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/d259-import.log
          if grep -E -i "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script" /tmp/d259-import.log; then
            exit 1
          fi
      - name: Load real Battle route launcher without temporary sprite injection
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/godot --headless --path . --quit-after 24 \
            --scene res://scenes/dev/black_lantern_d259_real_battle_route_qa.tscn 2>&1 | tee /tmp/d259-route.log
          if grep -E -i "SCRIPT ERROR|Parse Error|Parser Error|D259: .*failed|D259: .*missing" /tmp/d259-route.log; then
            exit 1
          fi
      - name: Check actual Battle five canonical SpriteFrames and D253 light
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot-bin/godot --headless --path . \
            --scene res://scenes/dev/black_lantern_d259_battle_preflight.tscn \
            2>&1 | tee /tmp/d259-real-battle-preflight.log
          grep -q 'D259_REAL_BATTLE_PREFLIGHT_PASS:' /tmp/d259-real-battle-preflight.log
          if grep -E -i 'SCRIPT ERROR|Parse Error|Parser Error|D259_REAL_BATTLE_PREFLIGHT_FAIL' /tmp/d259-real-battle-preflight.log; then
            exit 1
          fi
      - name: Regression: run real 54-case BattleUnit combat matrix
        shell: bash
        run: |
          set -o pipefail
          timeout 180s /tmp/godot-bin/godot --headless --path . \
            --scene res://scenes/dev/black_lantern_d258_native_balance_matrix.tscn \
            2>&1 | tee /tmp/d259-matrix.log
          grep -q 'D258_MATRIX_RESULT ' /tmp/d259-matrix.log
          if grep -E -i "SCRIPT ERROR|Parse Error|Parser Error|D207: .*fail" /tmp/d259-matrix.log; then
            exit 1
          fi
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d259-godot-native-headless-logs
          path: /tmp/d259-*.log
          if-no-files-found: ignore
          retention-days: 14
