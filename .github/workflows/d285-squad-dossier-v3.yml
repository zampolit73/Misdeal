name: D285 approved third squad dossier UI native smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d285-squad-dossier-v3.yml'
      - 'scenes/table/squad_status.tscn'
      - 'scripts/table/squad_status.gd'
      - 'scripts/ui/squad_dossier_v3.gd'
      - 'scripts/ui/misdeal_ds3.gd'
      - 'scripts/dev/d285_squad_dossier_smoke.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d285-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d285-import.log; then exit 1; fi
      - name: Validate real squad dossier UI and RunState states
        shell: bash
        run: |
          set -o pipefail
          timeout 75s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d285_squad_dossier_smoke.gd 2>&1 | tee /tmp/d285-smoke.log
          grep -q 'D285_SQUAD_DOSSIER_NATIVE_PASS' /tmp/d285-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D285_SQUAD_DOSSIER_FAIL' /tmp/d285-smoke.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d285-squad-dossier-native-smoke
          path: /tmp/d285-*.log
          retention-days: 14
