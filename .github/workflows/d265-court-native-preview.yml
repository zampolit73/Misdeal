name: D265 Court rich empty arena native preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d265-court-native-preview.yml'
      - 'scripts/dev/court_of_the_mute_d265_richer_arena_preview.gd'
      - 'scenes/dev/court_of_the_mute_d265_richer_arena_preview.tscn'
      - 'assets/pixel/battle/arenas/court_of_the_mute_d265_rich_qa.webp.b64'
      - 'scripts/battle/authored_backdrop.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-rich-empty-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Get official Godot 4.7.2
        shell: bash
        run: |
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse GDScript
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d265-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d265-import.log; then exit 1; fi
      - name: Verify 1280x720 court candidate and chosen card art in native preview
        shell: bash
        run: |
          set -o pipefail
          timeout 50s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 25 --scene res://scenes/dev/court_of_the_mute_d265_richer_arena_preview.tscn 2>&1 | tee /tmp/d265-preview.log
          grep -q 'D265_COURT_RICH_EMPTY_F6_PASS' /tmp/d265-preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D265_COURT_ARENA_PREVIEW_FAIL' /tmp/d265-preview.log; then exit 1; fi
      - name: Recheck no Court card release in standard pool
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/core/run_state.gd').read_text()
          segment=s.split('const ACT1_CARD_IDS',1)[1].split(']',1)[0]
          assert '"court_of_the_mute"' not in segment
          assert '"black_lantern_road"' in segment
          t=Path('resources/cards/court_of_the_mute.tres').read_text()
          assert 'target_path = ""' in t
          print('D265_UNRELEASED_COURT_CARD_PASS: 38/45 live unchanged')
          PY
      - name: Store QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d265-rich-empty-arena-native-preview
          path: /tmp/d265-*.log
          retention-days: 14
