name: D257 Black Lantern three-atlas seam recovery QA

on:
  push:
    branches: [main]
    paths:
      - 'tools/art/author_black_lantern_d257_seam_recovery.py'
      - '.github/workflows/d257-seam-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-three-qa-atlases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source processing dependencies
        run: python -m pip install 'Pillow>=10,<12' 'numpy>=1.26,<3' 'opencv-python-headless>=4.9,<5'
      - name: Recover source side details without releasing game art
        run: python tools/art/author_black_lantern_d257_seam_recovery.py
      - name: Commit QA-only generated atlases and source warnings
        run: |
          git add assets/pixel/units/black_lantern_road_qa/*_d257_seam_recovery_qa.webp.b64 docs/qa/D257_SEAM_RECOVERY_QC.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'art(d257): stage reconstructed Black Lantern three-role atlases for QA'
            git push origin HEAD:main
          fi
