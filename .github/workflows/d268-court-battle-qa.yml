name: D268 Court real Battle QA and 54-case matrix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d268-court-battle-qa.yml'
      - 'scripts/dev/court_of_the_mute_d268_*.gd'
      - 'scripts/dev/court_of_the_mute_d269_*.gd'
      - 'scenes/dev/court_of_the_mute_d268_*.tscn'
      - 'scenes/dev/court_of_the_mute_d269_*.tscn'
      - 'scripts/battle/authored_backdrop.gd'
      - 'assets/pixel/battle/arenas/court_of_the_mute_d270_empty_qa.svg'
      - 'scripts/battle/battle_visual.gd'
      - 'scripts/dev/court_of_the_mute_d267_rich_animation_preview.gd'
      - 'scenes/dev/court_of_the_mute_d267_rich_animation_preview.tscn'
      - 'scripts/battle/court_verdict.gd'
      - 'resources/encounters/court_of_the_mute.tres'
      - 'resources/units/mute_magistrate.tres'
      - 'resources/units/ash_scrivener.tres'
      - 'resources/units/bone_bailiff.tres'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-court-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 GDScript
        shell: bash
        run: |
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Project import, GDScript parse
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d268-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d268-import.log; then exit 1; fi
      - name: D268 F6 real Court battle launcher native headless load
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 18 --scene res://scenes/dev/court_of_the_mute_d268_real_battle_preview.tscn 2>&1 | tee /tmp/d268-preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D268:.*(failed|ошибка)' /tmp/d268-preview.log; then exit 1; fi
      - name: Rich D267 combined art QA viewer frame-step controls load
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 24 --scene res://scenes/dev/court_of_the_mute_d267_rich_animation_preview.tscn 2>&1 | tee /tmp/d268-art-gallery.log
          grep -q 'D267_THREE_RICH_COURT_F6_PASS:' /tmp/d268-art-gallery.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D268 THREE RICH COURT QA FAILURE:' /tmp/d268-art-gallery.log; then exit 1; fi
      - name: Existing six genuine Court Battle launch contract
        shell: bash
        run: |
          set -o pipefail
          timeout 100s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://scenes/dev/court_of_the_mute_d262_real_battle_boot.tscn 2>&1 | tee /tmp/d268-six-boot.log
          grep -q 'D262_COURT_REAL_BATTLE_PASS' /tmp/d268-six-boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D262_COURT_REAL_BATTLE_FAIL' /tmp/d268-six-boot.log; then exit 1; fi
      - name: D269 actual Court Battle F6 L-light and G-floor native contract
        shell: bash
        run: |
          set -o pipefail
          timeout 100s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://scenes/dev/court_of_the_mute_d269_visual_qa_contract.tscn 2>&1 | tee /tmp/d268-d269-visual.log
          grep -q 'D269_COURT_NATIVE_VISUAL_QA_PASS:' /tmp/d268-d269-visual.log
          grep -q 'D270_COURT_EMPTY_SVG_NATIVE_PASS:' /tmp/d268-d269-visual.log
          grep -q 'D270_COURT_BACKGROUND_AB_NATIVE_PASS:' /tmp/d268-d269-visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D269_COURT_NATIVE_VISUAL_QA_FAIL:' /tmp/d268-d269-visual.log; then exit 1; fi
      - name: All 54 Court BattleUnit original enemy balance and verdict cases
        shell: bash
        run: |
          set -o pipefail
          timeout 150s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://scenes/dev/court_of_the_mute_d268_balance_matrix.tscn 2>&1 | tee /tmp/d268-matrix.log
          grep -q 'D268_COURT_54_CASE_FUNCTIONAL_PASS:' /tmp/d268-matrix.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D268_COURT_54_CASE_FUNCTIONAL_FAIL:' /tmp/d268-matrix.log; then exit 1; fi
      - name: Unreleased Court real Battle Fight Reward Table route
        shell: bash
        run: |
          set -o pipefail
          timeout 160s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://scenes/dev/court_of_the_mute_d268_qa_route_runner.tscn 2>&1 | tee /tmp/d268-route.log
          grep -q 'D268_COURT_QA_ROUTE_READY:' /tmp/d268-route.log
          grep -q 'D268_COURT_QA_ROUTE_PASS:' /tmp/d268-route.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D268_COURT_QA_ROUTE_FAIL:' /tmp/d268-route.log; then exit 1; fi
      - name: Preserve QA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d268-court-qa-logs
          path: /tmp/d268-*.log
          retention-days: 14
