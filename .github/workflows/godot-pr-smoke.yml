name: Misdeal Godot PR smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'QA scope: auto, fast, visual or release'
        required: true
        type: choice
        default: release
        options:
          - auto
          - fast
          - visual
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  godot-pr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify impact selector rules
        shell: bash
        run: python3 -m unittest discover -s scripts/ci -p 'test_smart_qa_select.py' -v

      - name: Determine SAFE native QA mode and affected scenes
        id: scope
        shell: bash
        env:
          QA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/smart_qa_select.py --mode "$QA_MODE" --base "$BASE_SHA" \
            --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
          echo "### Misdeal Smart QA — selected mode: $QA_MODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Install checksum-verified Godot 4.7.2
        if: steps.scope.outputs.mode != 'docs'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64

      - name: Project import and GDScript parsing
        if: steps.scope.outputs.mode != 'docs'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/misdeal-smart-qa"
          godot=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          if ! timeout 300s "$godot" --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/misdeal-smart-qa/import.log"; then
            echo '❌ Godot import failed' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if grep -Eq 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' "$RUNNER_TEMP/misdeal-smart-qa/import.log"; then
            echo '❌ GDScript or Godot resource parse error' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '✅ Godot project import and GDScript parsing passed' >> "$GITHUB_STEP_SUMMARY"

      - name: Relevant native Godot smoke tests
        if: steps.scope.outputs.mode != 'docs'
        shell: bash
        env:
          TESTS: ${{ steps.scope.outputs.tests }}
          MODE: ${{ steps.scope.outputs.mode }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          set -uo pipefail
          godot=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          out="$RUNNER_TEMP/misdeal-smart-qa"
          read -ra names <<< "$TESTS"
          echo "## $MODE — native smokes" >> "$GITHUB_STEP_SUMMARY"
          echo "Selection: $REASON" >> "$GITHUB_STEP_SUMMARY"
          failures=0
          for name in "${names[@]}"; do
            case "$name" in
              class-select) script='d279_class_select_smoke.gd'; expected='D282_CLASS_SELECT_PASS' ;;
              table) script='d289_table_ds3_smoke.gd'; expected='D289_DS3_TABLE_NATIVE_PASS' ;;
              battle) script='d291_battle_ds3_smoke.gd'; expected='D291_BATTLE_DS3_NATIVE_PASS' ;;
              wizard-objective) script='d306_wizard_objective_smoke.gd'; expected='D306_WIZARD_OBJECTIVE_NATIVE_PASS' ;;
              wizard-preview) script='d308_wizard_preview_smoke.gd'; expected='D308_WIZARD_PREVIEW_NATIVE_PASS' ;;
              cards) script='d315_card_ds3_smoke.gd'; expected='D315_CARD_DS3_NATIVE_PASS' ;;
              card-surfaces) script='d316_card_surfaces_smoke.gd'; expected='D316_CARD_SURFACES_NATIVE_PASS' ;;
              qa-hub) script='qa_hub_smoke.gd'; expected='OPT4_QA_HUB_PASS' ;;
              *) echo "Unknown test requested: $name" >&2; exit 1 ;;
            esac
            echo "::group::Godot smoke: $name"
            log="$out/$name.log"
            if timeout 110s "$godot" --headless --path . --script "res://scripts/dev/$script" 2>&1 | tee "$log"; then
              status=0
            else
              status=$?
            fi
            if [ "$status" -eq 0 ] && grep -Fq "$expected" "$log" && ! grep -Eq 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|[A-Z0-9_]+_FAIL' "$log"; then
              echo "- ✅ $name — $expected" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $name — exit=$status, expected $expected (see $name.log)" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "Godot smoke failures: $failures" >&2
            exit 1
          fi

      - name: Prepare GPU for requested VISUAL/RELEASE previews
        if: steps.scope.outputs.mode == 'visual' || steps.scope.outputs.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          mkdir -p "$RUNNER_TEMP/misdeal-smart-qa/visual"

      - name: Capture actual current Godot scene screenshots
        if: steps.scope.outputs.mode == 'visual' || steps.scope.outputs.mode == 'release'
        shell: bash
        env:
          SCENES: ${{ steps.scope.outputs.scenes }}
        run: |
          set -euo pipefail
          read -ra scenes <<< "$SCENES"
          godot=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          dest="$RUNNER_TEMP/misdeal-smart-qa/visual"
          n=0
          for scene in "${scenes[@]}"; do
            n=$((n + 1))
            printf -v number '%02d' "$n"
            png="$dest/$number-$scene.png"
            log="$dest/$number-$scene.log"
            timeout 110s xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              "$godot" --path . --windowed --resolution 1280x720 \
              --rendering-method gl_compatibility \
              --script res://scripts/dev/ci3_capture_rendered_scene.gd \
              -- "$scene" "$png" 2>&1 | tee "$log"
            grep -Fq "CI3_CAPTURE_PASS: $scene" "$log"
            test -s "$png"
            echo "- ✅ real scene screenshot: $scene (1280×720)" >> "$GITHUB_STEP_SUMMARY"
          done
          python3 - <<'PY'
          from pathlib import Path
          import os, struct
          directory = Path(os.environ["RUNNER_TEMP"]) / "misdeal-smart-qa" / "visual"
          images = list(directory.glob("*.png"))
          assert images, "no real scene images"
          for image in images:
              content = image.read_bytes()
              assert content[:8] == b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II", content[16:24]) == (1280, 720)
              assert len(content) > 10000, image.name
          PY

      - name: RELEASE — full authored Battle and animation matrix
        if: steps.scope.outputs.mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          dest="$RUNNER_TEMP/misdeal-smart-qa/release"
          mkdir -p "$dest/graveyard" "$dest/court-trio" "$dest/grave-bell-duo" "$dest/atlases"
          timeout 130s xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
            env LIBGL_ALWAYS_SOFTWARE=1 "$godot" --path . --windowed \
            --resolution 1280x720 --rendering-method gl_compatibility \
            --script res://scripts/dev/ci4_capture_real_battle.gd -- "$dest/graveyard" 2>&1 | tee "$dest/graveyard.log"
          grep -Fq 'CI4_BATTLE_CAPTURE_PASS' "$dest/graveyard.log"
          for scenario in court-trio grave-bell-duo; do
            timeout 130s xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
              env LIBGL_ALWAYS_SOFTWARE=1 "$godot" --path . --windowed \
              --resolution 1280x720 --rendering-method gl_compatibility \
              --script res://scripts/dev/ci5_capture_multi_battle.gd \
              -- "$scenario" "$dest/$scenario" 2>&1 | tee "$dest/$scenario.log"
            grep -Fq "CI5_BATTLE_PASS: $scenario" "$dest/$scenario.log"
          done
          timeout 130s "$godot" --headless --path . \
            --script res://scripts/dev/ci5_animation_frame_audit.gd \
            -- "$dest/atlases" 2>&1 | tee "$dest/atlas.log"
          grep -Fq 'CI5_ANIMATION_PASS' "$dest/atlas.log"
          echo '✅ RELEASE: 7 core + QA Hub, five native scene previews, 3 real Battle cases and 75 Court poses.' >> "$GITHUB_STEP_SUMMARY"

      - name: Docs-only change (no Godot boot)
        if: steps.scope.outputs.mode == 'docs'
        shell: bash
        run: echo '✅ Documentation-only PR — no Godot binaries, imports or graphics jobs needed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence even if a test failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misdeal-smart-qa-evidence
          path: ${{ runner.temp }}/misdeal-smart-qa/
          if-no-files-found: ignore
          retention-days: 14
