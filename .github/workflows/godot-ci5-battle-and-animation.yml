name: CI5 battle matrix and authored sprite frame QA

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci5-godot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install verified official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Prepare Xvfb and import game resources
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          fi
          mkdir -p "$RUNNER_TEMP/misdeal-ci5"
          timeout 300s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/misdeal-ci5/import.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' "$RUNNER_TEMP/misdeal-ci5/import.log"; then exit 1; fi
      - name: Verify original Court character animation atlases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/misdeal-ci5/atlases"
          timeout 110s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . \
            --script res://scripts/dev/ci5_animation_frame_audit.gd \
            -- "$RUNNER_TEMP/misdeal-ci5/atlases" 2>&1 | tee "$RUNNER_TEMP/misdeal-ci5/atlases.log"
          grep -Fq 'CI5_ANIMATION_PASS' "$RUNNER_TEMP/misdeal-ci5/atlases.log"
          if grep -Eq 'SCRIPT ERROR|Parse Error|Parser Error|CI5_ANIMATION_FAIL' "$RUNNER_TEMP/misdeal-ci5/atlases.log"; then exit 1; fi
      - name: Render the two original Battle scenes and party configurations
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          for scenario in court-trio grave-bell-duo; do
            dest="$RUNNER_TEMP/misdeal-ci5/$scenario"
            mkdir -p "$dest"
            timeout 110s xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
              env LIBGL_ALWAYS_SOFTWARE=1 \
              "$godot" --path . --windowed --resolution 1280x720 \
              --rendering-method gl_compatibility \
              --script res://scripts/dev/ci5_capture_multi_battle.gd \
              -- "$scenario" "$dest" 2>&1 | tee "$RUNNER_TEMP/misdeal-ci5/$scenario.log"
            grep -Fq "CI5_BATTLE_PASS: $scenario" "$RUNNER_TEMP/misdeal-ci5/$scenario.log"
            if grep -Eq 'SCRIPT ERROR|Parse Error|Parser Error|CI5_BATTLE_FAIL' "$RUNNER_TEMP/misdeal-ci5/$scenario.log"; then exit 1; fi
            echo "✅ $scenario — real Battle startup, 4 rendered captures, original team motion." >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Validate native screenshots, pose atlases and motion metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, os, pathlib, struct
          home = pathlib.Path(os.environ["RUNNER_TEMP"]) / "misdeal-ci5"
          digests = set()
          for scenario in ("court-trio", "grave-bell-duo"):
              folder = home / scenario
              pngs = sorted(folder.glob("*.png"))
              assert len(pngs) == 4, (scenario, len(pngs))
              for file in pngs:
                  raw = file.read_bytes()
                  assert raw[:8] == b"\x89PNG\r\n\x1a\n" and raw[12:16] == b"IHDR"
                  assert struct.unpack(">II", raw[16:24]) == (1280, 720)
                  assert len(raw) > 10000, file.name
                  digest = hashlib.sha256(raw).hexdigest()
                  assert digest not in digests, f"duplicate battle frame {file}"
                  digests.add(digest)
                  print("CI5_FRAME_PASS", scenario, file.name, len(raw))
              with (folder / "motion.csv").open(newline="") as handle:
                  rows = list(csv.DictReader(handle))
              assert len(rows) == 4, scenario
              assert rows[0]["phase"] == "preparation"
              assert all(row["phase"] == "combat" for row in rows[1:])
              assert float(rows[-1]["max_displacement_px"]) >= 2.0, scenario
          atlases = sorted((home / "atlases").glob("*-original-25-poses.png"))
          assert len(atlases) == 3, len(atlases)
          for file in atlases:
              raw = file.read_bytes()
              assert raw[:8] == b"\x89PNG\r\n\x1a\n"
              assert struct.unpack(">II", raw[16:24]) == (576, 480)
              assert len(raw) > 10000
              print("CI5_ATLAS_PNG_PASS", file.name)
          with (home / "atlases" / "pose-foot-and-edge-audit.csv").open(newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 75, f"three 25-pose atlases required: {len(rows)}"
          print("CI5_NATIVE_PASS: 2 authentic Battle scenarios, 8 original frames, 3 original 25-pose atlases")
          PY
          echo '✅ CI5: 2 original live Battle variants (8 frames), 3 Court atlases with 75 unique frames and foot/edge audit.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain original Godot images and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: misdeal-ci5-battle-matrix-and-poses
          path: ${{ runner.temp }}/misdeal-ci5/
          if-no-files-found: warn
          retention-days: 14
