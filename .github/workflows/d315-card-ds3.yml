name: D315 unified approved Card DS3 native regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d315-card-ds3.yml'
      - 'assets/pixel/ui/card_ds3_locked/**'
      - 'shaders/card_ds3_ink.gdshader'
      - 'scripts/ui/card_ds3_skin.gd'
      - 'scripts/ui/card_art_catalog.gd'
      - 'scripts/table/table_offer_skin.gd'
      - 'scripts/table/table.gd'
      - 'scripts/table/fate_spread_overlay.gd'
      - 'scripts/reward/reward.gd'
      - 'scripts/dev/d315_card_ds3_gallery.gd'
      - 'scenes/dev/d315_card_ds3_gallery.tscn'
      - 'scripts/dev/d315_card_ds3_smoke.gd'
      - 'scripts/table/card_lore_inspect.gd'
      - 'scripts/dev/d316_card_surfaces_smoke.gd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-card-ds3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install verified official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 -L https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Import card art and parse the whole GDScript project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/d315-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script' /tmp/d315-import.log; then exit 1; fi
      - name: Test all original cards, reward choices and live visual states
        shell: bash
        run: |
          set -o pipefail
          timeout 110s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d315_card_ds3_smoke.gd 2>&1 | tee /tmp/d315-native.log
          grep -q 'D315_CARD_DS3_NATIVE_PASS' /tmp/d315-native.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D315_CARD_DS3_FAIL' /tmp/d315-native.log; then exit 1; fi
      - name: Test DS3 full-card reader and all Fate Spread physical slots
        shell: bash
        run: |
          set -o pipefail
          timeout 110s /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/dev/d316_card_surfaces_smoke.gd 2>&1 | tee /tmp/d316-native.log
          grep -q 'D316_CARD_SURFACES_NATIVE_PASS' /tmp/d316-native.log
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|D316_CARD_SURFACES_FAIL' /tmp/d316-native.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d315-card-ds3-native
          path: |
            /tmp/d315-*.log
            /tmp/d316-*.log
          retention-days: 14
