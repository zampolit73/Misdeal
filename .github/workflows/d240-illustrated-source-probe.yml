name: D240 Fullbody Art Source Probe

on:
  push:
    branches: [main]
    paths:
      - 'tools/art/inspect_road_sentinel_d240_d235_fullbody.py'
      - '.github/workflows/d240-illustrated-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12' numpy 'opencv-python-headless>=4.9,<5'
      - name: Rebuild 6 illustrated D235 full-body source mattes (internal probe only)
        run: python tools/art/inspect_road_sentinel_d240_d235_fullbody.py
      - name: Save only QA source inspection result
        run: |
          git add assets/pixel/units/black_lantern_road_qa/road_sentinel_d240_d235_original_legs_source_probe.webp.b64 docs/qa/D240_D235_FULLBODY_SOURCE_PROBE.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'qa(d240): record fullbody D235 paint-source extraction probe'
            git push origin HEAD:main
          fi
